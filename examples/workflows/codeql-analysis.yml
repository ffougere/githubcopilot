name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Use default queries plus security-extended
        queries: security-extended
        # Optional: specify custom queries
        # queries: ./custom-queries,security-and-quality

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      # For compiled languages, you might need custom build steps:
      # - name: Build
      #   run: |
      #     make bootstrap
      #     make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
        # Upload results to GitHub Security tab
        upload: true
        # Optional: fail the build on high severity issues
        # fail-on: high
